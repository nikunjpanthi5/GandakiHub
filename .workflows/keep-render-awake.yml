
name: Keep GandakiHub Backend Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render backend
        run: |
          curl --fail --silent --show-error \
          https://gandakihub.onrender.com/api/health
